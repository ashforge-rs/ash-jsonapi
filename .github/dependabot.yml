version: 2

updates:
  # Grouped into one weekly pull request rather than one per crate: every bump
  # has to clear `cargo deny` and the full suite, and that is cheaper to review
  # once than a dozen times.
  #
  # Security updates are exempt from grouping by GitHub and arrive immediately
  # and individually, which is the behaviour worth having.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps land by hand. `axum` is the entire HTTP surface and a
      # major there changes the routes the macros generate — which is public
      # contract for clients, not just for callers. `serde` and `serde_json`
      # decide the bytes on the wire.
      - dependency-name: "axum"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serde"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serde_json"
        update-types: ["version-update:semver-major"]
      # The canonical `StatusCode` crossing the feature boundary, and what
      # axum re-exports; a major has to be taken in step with axum's.
      - dependency-name: "http"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns: ["*"]
